name: Atualizar README do perfil

on:
  schedule:
    - cron: '0 9 * * *' # todo dia, 6h da manhã em Brasília
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gerar-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Atualiza estatísticas do perfil"
          git push
